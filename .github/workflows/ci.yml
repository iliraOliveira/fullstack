name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install dotnet-format
        run: |
          dotnet tool install --global dotnet-format
      - name: Run backend lint (dotnet-format check)
        working-directory: Api
        run: |
          echo "Running dotnet-format --verify-no-changes"
          dotnet format --verify-no-changes
      - name: Restore & Build API
        working-directory: Api
        run: |
          dotnet restore
          dotnet build --no-restore -c Release

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Client
        working-directory: client
        run: |
          npm ci
          # Run project checks (lint/format) using the workspace biome installation
          npm run lint --if-present
          # Build the client
          npm run build --if-present
